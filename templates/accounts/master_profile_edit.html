{% extends 'base.html' %}{% load i18n %}
{% block title %}{% translate 'Профиль мастера — ESEPTEP' %}{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <h1>{% translate 'Редактирование профиля мастера' %}</h1>
    <form method="post" enctype="multipart/form-data" class="auth-form">
      {% csrf_token %}
      {% for field in form %}
      <label class="auth-field">
        <span>{{ field.label }}</span>
        {{ field }}
        {% if field.errors %}<small>{{ field.errors|striptags }}</small>{% endif %}
      </label>
      {% endfor %}
      <button class="btn btn--primary" type="submit">{% translate 'Сохранить профиль' %}</button>
    </form>
  </div>
</section>
{% endblock %}
