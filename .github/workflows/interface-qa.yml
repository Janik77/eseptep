name: Minimal interface and localization QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DJANGO_ENV: test
      DJANGO_DB_PATH: /tmp/eseptep-browser-qa.sqlite3
      DJANGO_PRIVATE_MEDIA_ROOT: /tmp/eseptep-browser-qa-media
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      ESEPTEP_BROWSER_QA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check && python manage.py makemigrations --check --dry-run && python manage.py test
      - run: node --test calculators/js_tests/*.test.cjs
      - name: Real SQLite price publication and save concurrency
        env:
          DJANGO_DB_PATH: /tmp/eseptep-browser-qa-concurrency.sqlite3
        run: |
          python manage.py migrate --noinput
          PYTHONPATH=. python tools/qa_price_concurrency.py

      - name: Real SQLite typed rate publication and upload save concurrency
        env:
          DJANGO_DB_PATH: /tmp/eseptep-browser-qa-typed-concurrency.sqlite3
        run: |
          python manage.py migrate --noinput
          PYTHONPATH=. python tools/qa_typed_rate_concurrency.py

      - name: Real SQLite consumption publication and estimate save concurrency
        env:
          DJANGO_DB_PATH: /tmp/eseptep-browser-qa-selflevel-concurrency.sqlite3
        run: |
          python manage.py migrate --noinput
          PYTHONPATH=. python tools/qa_selflevel_concurrency.py

      - name: Real SQLite film parameter publication and estimate save concurrency
        env:
          DJANGO_DB_PATH: /tmp/eseptep-browser-qa-demolition-concurrency.sqlite3
        run: |
          python manage.py migrate --noinput
          PYTHONPATH=. python tools/qa_demolition_concurrency.py

      - run: npm install --prefix /tmp/eseptep-browser-driver playwright@1.65.0
      # Use the runner's packaged Chrome with its supported sandbox profile.
      # Never disable Chromium sandboxing or change host security settings.
      - run: google-chrome --version
      - run: /tmp/eseptep-browser-driver/node_modules/.bin/playwright install ffmpeg
      - run: python manage.py migrate --noinput && PYTHONPATH=. python tools/qa_browser_seed.py
      - name: Browser workflow and screenshots
        run: |
          python manage.py runserver 127.0.0.1:8197 --noreload > /tmp/eseptep-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8197/ >/dev/null && break || sleep 1; done
          PLAYWRIGHT_PACKAGE=/tmp/eseptep-browser-driver/node_modules/playwright node tools/qa_browser.mjs
          PLAYWRIGHT_PACKAGE=/tmp/eseptep-browser-driver/node_modules/playwright node tools/qa_material_prices.mjs
          PLAYWRIGHT_PACKAGE=/tmp/eseptep-browser-driver/node_modules/playwright node tools/qa_supplier_publication.mjs
          PLAYWRIGHT_PACKAGE=/tmp/eseptep-browser-driver/node_modules/playwright node tools/qa_typed_rates.mjs
          PLAYWRIGHT_PACKAGE=/tmp/eseptep-browser-driver/node_modules/playwright node tools/qa_selflevel_parameter.mjs
          PLAYWRIGHT_PACKAGE=/tmp/eseptep-browser-driver/node_modules/playwright node tools/qa_demolition_parameter.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-interface-browser-evidence
          path: |
            browser-evidence/
            /tmp/eseptep-browser-server.log
          retention-days: 14
