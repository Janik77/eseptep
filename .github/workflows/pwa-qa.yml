name: ESEPTEP PWA browser acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwa:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, webkit]
    env:
      DJANGO_ENV: test
      DJANGO_DB_PATH: /tmp/eseptep-pwa-browser-qa.sqlite3
      DJANGO_PRIVATE_MEDIA_ROOT: /tmp/eseptep-pwa-browser-qa-private
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      ESEPTEP_BROWSER_QA: '1'
      PLAYWRIGHT_PACKAGE: /tmp/pwa-driver/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test core.test_pwa && python manage.py check && python manage.py makemigrations --dry-run --check
      - run: npm install --prefix /tmp/pwa-driver playwright@1.65.0
      - if: matrix.engine == 'webkit'
        run: /tmp/pwa-driver/node_modules/.bin/playwright install --with-deps webkit
      - if: matrix.engine == 'chrome'
        run: google-chrome --version
      - run: python manage.py migrate --noinput && PYTHONPATH=. python tools/qa_browser_seed.py
      - name: Isolated browser acceptance
        run: |
          python manage.py runserver 127.0.0.1:8201 --noreload >/tmp/pwa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8201/ >/dev/null && break; sleep 1; done
          xvfb-run -a node tools/qa_pwa.mjs "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-${{ matrix.engine }}-evidence
          path: |
            pwa-evidence/
            /tmp/pwa-server.log
